<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="600" height="400" rx="24" fill="url(#bg)"/>
  <rect x="40" y="40" width="520" height="320" rx="16" fill="white" fill-opacity="0.12"/>
  <text x="300" y="175" text-anchor="middle" font-size="72" fill="white" filter="url(#shadow)">❓</text>
  <text x="300" y="250" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="32" font-weight="700" fill="white" filter="url(#shadow)">FAQ Bot</text>
  <rect x="200" y="280" width="200" height="4" rx="2" fill="white" fill-opacity="0.4"/>
</svg>
